<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMed - Medical Professional Login & Signup</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3c72">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EaseMed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="EaseMed Clinical Clerk System — medical history taking guide based on Hutchison's Clinical Methods">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c4a6e 0%, #1e3a5f 25%, #2d3748 50%, #1a3a4f 75%, #0f2c44 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Medical Background */
        .medical-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .medical-bg::before {
            content: '🫀';
            position: absolute;
            font-size: 300px;
            opacity: 0.03;
            bottom: -50px;
            right: -50px;
            animation: float 20s infinite ease-in-out;
        }

        .medical-bg::after {
            content: '🩺';
            position: absolute;
            font-size: 250px;
            opacity: 0.03;
            top: -50px;
            left: -50px;
            animation: float 15s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, -30px) rotate(10deg); }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .cross {
            position: absolute;
            font-size: 40px;
            opacity: 0.05;
            animation: crossRotate 30s linear infinite;
        }

        @keyframes crossRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Main Container */
        .login-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px;
            width: 550px;
            max-width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2ecc71, #3498db, #e74c3c, #f39c12, #2ecc71);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
            border-radius: 40px 40px 0 0;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 60px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s;
            color: #64748b;
        }

        .tab.active {
            background: linear-gradient(135deg, #2c5282, #1e3a5f);
            color: white;
            box-shadow: 0 5px 15px rgba(44, 82, 130, 0.3);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 70px;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #1e3a5f, #2c5282);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 10px;
        }

        .logo p {
            color: #718096;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* Form Styles */
        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #2c5282;
            box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1);
            transform: translateY(-2px);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Button */
        .login-btn, .signup-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2c5282, #1e3a5f);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover, .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(44, 82, 130, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 15px;
            color: #a0aec0;
            font-size: 0.8rem;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 14px;
        }

        .social-btn img {
            width: 18px;
            height: 18px;
        }

        .btn-google {
            color: #DB4437;
            border-color: #DB4437;
        }

        .btn-google:hover {
            background: #DB4437;
            color: white;
            transform: translateY(-3px);
        }

        .btn-google:hover img {
            filter: brightness(0) invert(1);
        }

        .btn-facebook {
            color: #1877F2;
            border-color: #1877F2;
        }

        .btn-facebook:hover {
            background: #1877F2;
            color: white;
            transform: translateY(-3px);
        }

        .btn-facebook:hover img {
            filter: brightness(0) invert(1);
        }

        /* Demo Card */
        .demo-card {
            background: linear-gradient(135deg, #ebf8ff, #e6f7ff);
            border-radius: 14px;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #bee3f8;
        }

        .demo-card p {
            color: #2c5282;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .demo-cred {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .demo-cred span {
            background: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 11px;
            color: #2c5282;
            cursor: pointer;
            transition: all 0.3s;
        }

        .demo-cred span:hover {
            background: #2c5282;
            color: white;
        }

        /* Alert */
        .alert {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border-left: 4px solid #e53e3e;
        }

        .alert-success {
            background: #c6f6d5;
            color: #276749;
            border-left: 4px solid #38a169;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #a0aec0;
        }

        @media (max-width: 550px) {
            .login-container {
                padding: 30px 25px;
            }
            .social-buttons {
                flex-direction: column;
            }
            .input-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .logo h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 8 + 4 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // Store users in localStorage
        let users = JSON.parse(localStorage.getItem('easemed_users')) || [];

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMsg');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabs = document.querySelectorAll('.tab');
            
            if (tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        function fillDemo(email, password) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            showAlert('Demo credentials filled! Click Login to continue.', 'success');
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showAlert('Please enter both email and password', 'error');
                return;
            }
            
            // Demo accounts
            if ((email === 'student@easemed.com' && password === 'student123') ||
                (email === 'doctor@easemed.com' && password === 'doctor123')) {
                showAlert('Login successful! Redirecting to dashboard...', 'success');
                setTimeout(() => {
                    localStorage.setItem('easemed_logged_in', 'true');
                    localStorage.setItem('easemed_user', email);
                    window.location.href = 'easemed_dashboard.html';
                }, 1500);
                return;
            }
            
            // Check registered users
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                showAlert(`Welcome back ${user.name}! Redirecting...`, 'success');
                setTimeout(() => {
                    localStorage.setItem('easemed_logged_in', 'true');
                    localStorage.setItem('easemed_user', email);
                    window.location.href = 'easemed_dashboard.html';
                }, 1500);
            } else {
                showAlert('Invalid credentials. Use student@easemed.com / student123', 'error');
            }
        }

        function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const role = document.getElementById('signupRole').value;
            const university = document.getElementById('signupUniversity').value.trim();
            const yearOfStudy = document.getElementById('signupYear').value;
            const license = document.getElementById('signupLicense').value.trim();
            const location = document.getElementById('signupLocation').value.trim();
            
            if (!name || !email || !password || !role || !university || !yearOfStudy) {
                showAlert('Please fill in all required fields (*)', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (users.find(u => u.email === email)) {
                showAlert('Email already registered. Please login.', 'error');
                return;
            }
            
            const newUser = {
                id: users.length + 1,
                name: name,
                email: email,
                phone: phone,
                password: password,
                role: role,
                university: university,
                yearOfStudy: yearOfStudy,
                license: license,
                location: location,
                registeredAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('easemed_users', JSON.stringify(users));
            
            showAlert(`Account created successfully! Welcome ${name}!`, 'success');
            
            setTimeout(() => {
                switchTab('login');
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPassword').value = '';
            }, 1500);
        }

        function socialLogin(provider) {
            showAlert(`Connecting with ${provider}...`, 'success');
            setTimeout(() => {
                localStorage.setItem('easemed_logged_in', 'true');
                localStorage.setItem('easemed_user', `${provider}_user@easemed.com`);
                window.location.href = 'easemed_dashboard.html';
            }, 1000);
        }

        function socialSignup(provider) {
            showAlert(`Signing up with ${provider}...`, 'success');
            setTimeout(() => {
                localStorage.setItem('easemed_logged_in', 'true');
                localStorage.setItem('easemed_user', `${provider}_user@easemed.com`);
                window.location.href = 'easemed_dashboard.html';
            }, 1000);
        }

        // Enter key support
        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        
        document.getElementById('signupConfirmPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSignup();
        });

        // ── SERVICE WORKER REGISTRATION ──────────────────────────
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('[EaseMed] SW registered:', reg.scope))
                    .catch(err => console.warn('[EaseMed] SW registration failed:', err));
            });
        }

        // ── PWA INSTALL PROMPT ────────────────────────────────────
        // Catches the browser's beforeinstallprompt event and shows
        // a custom "Add to Home Screen" banner at the bottom of the page.
        let deferredPrompt;
        const installBanner = document.createElement('div');
        installBanner.id = 'installBanner';
        installBanner.innerHTML = `
            <div style="
                position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
                background: linear-gradient(135deg, #1e3c72, #2a5298);
                color: white; padding: 14px 24px; border-radius: 16px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.4);
                display: flex; align-items: center; gap: 14px;
                font-family: 'Segoe UI', sans-serif; font-size: 0.9rem;
                z-index: 99999; min-width: 300px; max-width: 90vw;
                animation: slideUp 0.4s ease;">
                <span style="font-size:1.6rem;">🩺</span>
                <div>
                    <div style="font-weight:700; margin-bottom:2px;">Install EaseMed</div>
                    <div style="opacity:0.85; font-size:0.8rem;">Add to home screen for offline access</div>
                </div>
                <div style="display:flex; gap:8px; margin-left:auto;">
                    <button id="installBtn" style="
                        background: white; color: #1e3c72; border: none;
                        padding: 8px 16px; border-radius: 10px; font-weight: 700;
                        cursor: pointer; font-size: 0.85rem;">Install</button>
                    <button id="dismissBtn" style="
                        background: rgba(255,255,255,0.15); color: white; border: none;
                        padding: 8px 12px; border-radius: 10px; cursor: pointer;
                        font-size: 0.85rem;">✕</button>
                </div>
            </div>`;

        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            document.body.appendChild(installBanner);

            document.getElementById('installBtn').addEventListener('click', async () => {
                installBanner.remove();
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('[EaseMed] Install outcome:', outcome);
                deferredPrompt = null;
            });

            document.getElementById('dismissBtn').addEventListener('click', () => {
                installBanner.remove();
            });
        });

        window.addEventListener('appinstalled', () => {
            console.log('[EaseMed] App installed successfully');
            installBanner.remove();
        });
    </script>
    <style>
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</body>
</html>
