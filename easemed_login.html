<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMed - Medical Professional Login & Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c4a6e 0%, #1e3a5f 25%, #2d3748 50%, #1a3a4f 75%, #0f2c44 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Medical Background */
        .medical-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .medical-bg::before {
            content: '🫀';
            position: absolute;
            font-size: 300px;
            opacity: 0.03;
            bottom: -50px;
            right: -50px;
            animation: float 20s infinite ease-in-out;
        }

        .medical-bg::after {
            content: '🩺';
            position: absolute;
            font-size: 250px;
            opacity: 0.03;
            top: -50px;
            left: -50px;
            animation: float 15s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, -30px) rotate(10deg); }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .cross {
            position: absolute;
            font-size: 40px;
            opacity: 0.05;
            animation: crossRotate 30s linear infinite;
        }

        @keyframes crossRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Main Container */
        .login-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px;
            width: 550px;
            max-width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2ecc71, #3498db, #e74c3c, #f39c12, #2ecc71);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
            border-radius: 40px 40px 0 0;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 60px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s;
            color: #64748b;
        }

        .tab.active {
            background: linear-gradient(135deg, #2c5282, #1e3a5f);
            color: white;
            box-shadow: 0 5px 15px rgba(44, 82, 130, 0.3);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 70px;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #1e3a5f, #2c5282);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 10px;
        }

        .logo p {
            color: #718096;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* Form Styles */
        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #2c5282;
            box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1);
            transform: translateY(-2px);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Button */
        .login-btn, .signup-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2c5282, #1e3a5f);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover, .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(44, 82, 130, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 15px;
            color: #a0aec0;
            font-size: 0.8rem;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 14px;
        }

        .social-btn img {
            width: 18px;
            height: 18px;
        }

        .btn-google {
            color: #DB4437;
            border-color: #DB4437;
        }

        .btn-google:hover {
            background: #DB4437;
            color: white;
            transform: translateY(-3px);
        }

        .btn-google:hover img {
            filter: brightness(0) invert(1);
        }

        .btn-facebook {
            color: #1877F2;
            border-color: #1877F2;
        }

        .btn-facebook:hover {
            background: #1877F2;
            color: white;
            transform: translateY(-3px);
        }

        .btn-facebook:hover img {
            filter: brightness(0) invert(1);
        }

        /* Demo Card */
        .demo-card {
            background: linear-gradient(135deg, #ebf8ff, #e6f7ff);
            border-radius: 14px;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #bee3f8;
        }

        .demo-card p {
            color: #2c5282;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .demo-cred {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .demo-cred span {
            background: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 11px;
            color: #2c5282;
            cursor: pointer;
            transition: all 0.3s;
        }

        .demo-cred span:hover {
            background: #2c5282;
            color: white;
        }

        /* Alert */
        .alert {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border-left: 4px solid #e53e3e;
        }

        .alert-success {
            background: #c6f6d5;
            color: #276749;
            border-left: 4px solid #38a169;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #a0aec0;
        }

        @media (max-width: 550px) {
            .login-container {
                padding: 30px 25px;
            }
            .social-buttons {
                flex-direction: column;
            }
            .input-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .logo h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    // ================================================================
    //  EASEMED — SUPABASE INTEGRATION
    // ================================================================
    const SUPABASE_URL    = 'https://uhjcybwczelmqkkapeac.supabase.co';
    const SUPABASE_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoamN5YndjemVsbXFra2FwZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTU3NjEsImV4cCI6MjA5Njc5MTc2MX0.mEkfofQUeBpjOgdyWqCkiX695pxbjY1LUpYrzhVH1Jc';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON);

    const DEMO_ACCOUNTS = [
        { email: 'student@easemed.com', password: 'student123', name: 'Demo Student' },
        { email: 'doctor@easemed.com',  password: 'doctor123',  name: 'Demo Doctor'  },
    ];

    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertMsg');
        alertDiv.textContent = message;
        alertDiv.className = `alert alert-${type}`;
        alertDiv.style.display = 'block';
        setTimeout(() => { alertDiv.style.display = 'none'; }, 4000);
    }

    function setLoading(btnId, loading, originalText) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.disabled = loading;
        btn.textContent = loading ? '⏳ Please wait...' : originalText;
    }

    function switchTab(tab) {
        const loginForm  = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const tabs       = document.querySelectorAll('.tab');
        if (tab === 'login') {
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
        } else {
            loginForm.classList.remove('active');
            signupForm.classList.add('active');
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
        }
    }

    function fillDemo(email, password) {
        document.getElementById('loginEmail').value    = email;
        document.getElementById('loginPassword').value = password;
        showAlert('Demo credentials filled! Click Login to continue.', 'success');
    }

    function getDeviceType() {
        const ua = navigator.userAgent;
        if (/Mobi|Android/i.test(ua)) return 'mobile';
        if (/Tablet|iPad/i.test(ua))  return 'tablet';
        return 'desktop';
    }

    function getBrowserName() {
        const ua = navigator.userAgent;
        if (ua.includes('Chrome'))  return 'Chrome';
        if (ua.includes('Firefox')) return 'Firefox';
        if (ua.includes('Safari'))  return 'Safari';
        if (ua.includes('Edge'))    return 'Edge';
        return 'Unknown';
    }

    async function createSession(userId) {
        try {
            const { data, error } = await db
                .from('sessions')
                .insert({
                    user_id    : userId,
                    device_type: getDeviceType(),
                    browser    : getBrowserName(),
                    user_agent : navigator.userAgent,
                    country    : 'Uganda',
                })
                .select('id')
                .single();
            if (error) throw error;
            localStorage.setItem('easemed_session_id', data.id);
            return data.id;
        } catch (err) {
            console.warn('Session creation warning:', err.message);
            return null;
        }
    }

    async function closeSession() {
        const sessionId = localStorage.getItem('easemed_session_id');
        if (!sessionId) return;
        try {
            await db
                .from('sessions')
                .update({ logged_out_at: new Date().toISOString() })
                .eq('id', sessionId);
            localStorage.removeItem('easemed_session_id');
        } catch (err) {
            console.warn('Session close warning:', err.message);
        }
    }

    async function logActivity(userId, action, metadata = {}) {
        try {
            const sessionId = localStorage.getItem('easemed_session_id');
            await db.from('activity_logs').insert({
                user_id   : userId,
                session_id: sessionId || null,
                action    : action,
                severity  : 'info',
                metadata  : metadata,
                user_agent: navigator.userAgent,
            });
        } catch (err) {
            console.warn('Activity log warning:', err.message);
        }
    }

    async function handleLogin() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            showAlert('Please enter both email and password.', 'error');
            return;
        }

        const demoAccount = DEMO_ACCOUNTS.find(
            d => d.email === email && d.password === password
        );
        if (demoAccount) {
            showAlert(`Welcome, ${demoAccount.name}! Redirecting...`, 'success');
            localStorage.setItem('easemed_logged_in', 'true');
            localStorage.setItem('easemed_user', email);
            localStorage.setItem('easemed_user_name', demoAccount.name);
            localStorage.setItem('easemed_is_demo', 'true');
            setTimeout(() => {
                window.location.href = 'easemed_dashboard.html';
            }, 1200);
            return;
        }

        setLoading('loginBtn', true, 'Login to EaseMed');

        try {
            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                if (error.message.includes('Invalid login')) {
                    showAlert('Incorrect email or password. Please try again.', 'error');
                } else if (error.message.includes('Email not confirmed')) {
                    showAlert('Please verify your email before logging in. Check your inbox.', 'error');
                } else {
                    showAlert(error.message, 'error');
                }
                setLoading('loginBtn', false, 'Login to EaseMed');
                return;
            }

            const user = data.user;

            const { data: profile, error: profileError } = await db
                .from('profiles')
                .select('full_name, status, role, plan')
                .eq('id', user.id)
                .single();

            if (profile && profile.status === 'suspended') {
                showAlert('Your account has been suspended. Contact support.', 'error');
                await db.auth.signOut();
                setLoading('loginBtn', false, 'Login to EaseMed');
                return;
            }

            if (profile && profile.status === 'banned') {
                showAlert('Your account has been permanently banned.', 'error');
                await db.auth.signOut();
                setLoading('loginBtn', false, 'Login to EaseMed');
                return;
            }

            await createSession(user.id);
            await logActivity(user.id, 'login', {
                email      : email,
                device_type: getDeviceType(),
                browser    : getBrowserName(),
            });

            await db
                .from('profiles')
                .update({
                    total_logins: (profile?.total_logins || 0) + 1,
                    last_seen_at: new Date().toISOString(),
                })
                .eq('id', user.id);

            localStorage.setItem('easemed_logged_in',  'true');
            localStorage.setItem('easemed_user',        email);
            localStorage.setItem('easemed_user_id',     user.id);
            localStorage.setItem('easemed_user_name',   profile?.full_name || email);
            localStorage.setItem('easemed_user_role',   profile?.role || 'student');
            localStorage.setItem('easemed_user_plan',   profile?.plan || 'free');
            localStorage.setItem('easemed_is_demo',     'false');

            const name = profile?.full_name || 'User';
            showAlert(`Welcome back, ${name}! Redirecting...`, 'success');

            setTimeout(() => {
                if (profile?.role === 'admin' || profile?.role === 'superadmin') {
                    window.location.href = 'easemed_admin.html';
                } else {
                    window.location.href = 'easemed_dashboard.html';
                }
            }, 1200);

        } catch (err) {
            showAlert('Connection error. Please check your internet and try again.', 'error');
            console.error('Login error:', err);
            setLoading('loginBtn', false, 'Login to EaseMed');
        }
    }

    async function handleSignup() {
        const name            = document.getElementById('signupName').value.trim();
        const email           = document.getElementById('signupEmail').value.trim();
        const phone           = document.getElementById('signupPhone').value.trim();
        const password        = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('signupConfirmPassword').value;
        const role            = document.getElementById('signupRole').value;
        const university      = document.getElementById('signupUniversity').value.trim();
        const yearOfStudy     = document.getElementById('signupYear').value;
        const license         = document.getElementById('signupLicense').value.trim();
        const location        = document.getElementById('signupLocation').value.trim();

        if (!name || !email || !password || !role || !university || !yearOfStudy) {
            showAlert('Please fill in all required fields (*).', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showAlert('Passwords do not match.', 'error');
            return;
        }

        if (password.length < 6) {
            showAlert('Password must be at least 6 characters.', 'error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showAlert('Please enter a valid email address.', 'error');
            return;
        }

        setLoading('signupBtn', true, 'Create Account');

        try {
            const { data, error } = await db.auth.signUp({
                email   : email,
                password: password,
                options : {
                    data: {
                        full_name      : name,
                        phone          : phone,
                        role           : 'student',
                        university     : university,
                        year_of_study  : yearOfStudy,
                        license_number : license,
                        hospital       : location,
                    }
                }
            });

            if (error) {
                if (error.message.includes('already registered')) {
                    showAlert('This email is already registered. Please login.', 'error');
                } else {
                    showAlert(error.message, 'error');
                }
                setLoading('signupBtn', false, 'Create Account');
                return;
            }

            if (data.user) {
                await db.from('profiles').update({
                    phone          : phone || null,
                    university     : university,
                    license_number : license  || null,
                    hospital       : location || null,
                }).eq('id', data.user.id);
            }

            showAlert(
                `Account created! Welcome to EaseMed, ${name}. ` +
                `Please check your email to verify your account.`,
                'success'
            );

            setTimeout(() => {
                switchTab('login');
                document.getElementById('loginEmail').value    = email;
                document.getElementById('loginPassword').value = '';
                setLoading('signupBtn', false, 'Create Account');
            }, 2000);

        } catch (err) {
            showAlert('Connection error. Please try again.', 'error');
            console.error('Signup error:', err);
            setLoading('signupBtn', false, 'Create Account');
        }
    }

    async function socialLogin(provider) {
        try {
            showAlert(`Connecting with ${provider}...`, 'success');
            const { error } = await db.auth.signInWithOAuth({
                provider: provider.toLowerCase(),
                options : {
                    redirectTo: window.location.origin + '/easemed_dashboard.html'
                }
            });
            if (error) showAlert(error.message, 'error');
        } catch (err) {
            showAlert('Social login failed. Please try email login.', 'error');
        }
    }

    async function socialSignup(provider) {
        await socialLogin(provider);
    }

    let failedAttempts = parseInt(localStorage.getItem('easemed_failed_attempts') || '0');

    async function trackFailedLogin(email) {
        failedAttempts++;
        localStorage.setItem('easemed_failed_attempts', failedAttempts.toString());

        if (failedAttempts >= 5) {
            try {
                const { data: profile } = await db
                    .from('profiles')
                    .select('id')
                    .eq('email', email)
                    .single();

                if (profile) {
                    await db.from('security_flags').insert({
                        user_id    : profile.id,
                        flag_type  : 'multiple_failed_logins',
                        severity   : 'high',
                        description: `${failedAttempts} failed login attempts for ${email}`,
                        evidence   : { failed_attempts: failedAttempts, email },
                        user_agent : navigator.userAgent,
                    });
                }
            } catch (err) {
                console.warn('Security flag warning:', err.message);
            }
        }
    }

    db.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session) {
            localStorage.removeItem('easemed_failed_attempts');

            if (window.location.search.includes('access_token') ||
                window.location.hash.includes('access_token')) {

                const user = session.user;
                await createSession(user.id);
                await logActivity(user.id, 'login', { method: 'oauth' });

                localStorage.setItem('easemed_logged_in', 'true');
                localStorage.setItem('easemed_user',      user.email);
                localStorage.setItem('easemed_user_id',   user.id);
                localStorage.setItem('easemed_is_demo',   'false');

                window.location.href = 'easemed_dashboard.html';
            }
        }

        if (event === 'INITIAL_SESSION' && session) {
            const isDemo = localStorage.getItem('easemed_is_demo') === 'true';
            if (!isDemo) {
                window.location.href = 'easemed_dashboard.html';
            }
        }
    });

    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 4 + 2;
            particle.style.width            = size + 'px';
            particle.style.height           = size + 'px';
            particle.style.left             = Math.random() * 100 + '%';
            particle.style.animationDuration= Math.random() * 8 + 4 + 's';
            particle.style.animationDelay   = Math.random() * 5 + 's';
            container.appendChild(particle);
        }
    }
    createParticles();

    document.getElementById('loginPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('signupConfirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleSignup();
    });

    </script>
