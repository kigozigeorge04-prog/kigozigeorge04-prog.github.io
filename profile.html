<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseMed · My Profile</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#E8F4FD" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EaseMed" />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Local Supabase SDK -->
    <script src="/js/supabase.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #E8F4FD 0%, #B8D8F0 40%, #8EC4E8 100%);
            color: #0B1A2E;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 48px 52px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s ease forwards;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- HEADER ---- */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
            padding-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 36px;
        }
        .avatar-wrapper {
            position: relative;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.25);
            transition: transform 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.02);
        }
        .avatar-edit-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #3B82F6;
            border: 2px solid white;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .avatar-edit-btn:hover {
            background: #2563EB;
        }

        .profile-title {
            flex: 1;
        }
        .profile-title h1 {
            font-family: 'Lora', serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .profile-title .sub {
            font-size: 14px;
            color: rgba(11, 26, 46, 0.6);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .profile-title .sub .badge {
            background: rgba(59, 130, 246, 0.12);
            padding: 3px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            color: #3B82F6;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .btn-outline {
            padding: 9px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #0B1A2E;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .btn-primary {
            padding: 9px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ---- NOTICE ---- */
        .notice {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .notice-success {
            color: #065F46;
            border-color: rgba(52, 211, 153, 0.2);
            background: rgba(52, 211, 153, 0.06);
        }
        .notice-error {
            color: #991B1B;
            border-color: rgba(220, 38, 38, 0.2);
            background: rgba(220, 38, 38, 0.06);
        }
        .hidden {
            display: none !important;
        }

        /* ---- PROFILE GRID ---- */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .section {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.3s;
        }
        .section:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .section-header h3 {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }
        .section-header h3 svg {
            width: 20px;
            height: 20px;
            stroke: #3B82F6;
        }
        .edit-toggle {
            background: none;
            border: none;
            color: #3B82F6;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 8px;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .edit-toggle:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        /* ---- INFO ROWS ---- */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            gap: 20px;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-row .key {
            color: rgba(11, 26, 46, 0.5);
            font-weight: 400;
            min-width: 120px;
        }
        .info-row .value {
            font-weight: 500;
            color: #0B1A2E;
            text-align: right;
            flex: 1;
            word-break: break-word;
        }

        /* ---- EDIT FORM ---- */
        .edit-form {
            display: none;
            margin-top: 8px;
        }
        .edit-form.active {
            display: block;
            animation: slideUp 0.3s ease forwards;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(11, 26, 46, 0.6);
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #0B1A2E;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, background 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3B82F6;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }
        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-save {
            padding: 10px 28px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }
        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-cancel {
            padding: 10px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #0B1A2E;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ---- SPINNER ---- */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---- LOADING OVERLAY ---- */
        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 20px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.15);
            border-top-color: #3B82F6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            .profile-card {
                padding: 28px 20px;
                border-radius: 28px;
            }
            .profile-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .profile-actions {
                margin-left: 0;
                width: 100%;
            }
            .profile-actions button,
            .profile-actions a {
                flex: 1;
                justify-content: center;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 30px;
            }
            .profile-title h1 {
                font-size: 24px;
            }
            .section {
                padding: 20px;
            }
            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .info-row .value {
                text-align: left;
                width: 100%;
            }
            .section-header {
                flex-wrap: wrap;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .profile-card {
                padding: 20px 16px;
            }
            .form-actions {
                flex-direction: column;
            }
            .form-actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Loading State -->
        <div id="loadingState" class="loading-overlay">
            <div class="loading-spinner"></div>
            <div style="color: rgba(11,26,46,0.6); font-weight: 500;">Loading your profile...</div>
        </div>

        <!-- Profile Content -->
        <div id="profileContent" style="display:none;">
            <div class="profile-card">
                <!-- HEADER -->
                <div class="profile-header">
                    <div class="avatar-wrapper">
                        <div class="avatar" id="userAvatar">JD</div>
                        <button class="avatar-edit-btn" onclick="alert('📷 Change avatar coming soon!')">✎</button>
                    </div>
                    <div class="profile-title">
                        <h1 id="userFullName">Loading...</h1>
                        <div class="sub">
                            <span id="userRole">—</span>
                            <span class="badge" id="userYear">—</span>
                            <span id="userUniversity">—</span>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <a href="modules.html" class="btn-outline" style="text-decoration:none;">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            Back to Modules
                        </a>
                        <button class="btn-outline" onclick="handleLogout()">Sign out</button>
                    </div>
                </div>

                <!-- NOTICE -->
                <div id="profileNotice"></div>

                <!-- PROFILE CONTENT -->
                <div class="profile-grid">
                    <!-- PERSONAL INFORMATION -->
                    <div class="section">
                        <div class="section-header">
                            <h3>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                Personal Information
                            </h3>
                            <button class="edit-toggle" id="toggleEditBtn" onclick="toggleEdit()">✎ Edit</button>
                        </div>

                        <!-- VIEW MODE -->
                        <div id="viewMode">
                            <div class="info-row"><span class="key">Full name</span><span class="value" id="infoName">—</span></div>
                            <div class="info-row"><span class="key">Email</span><span class="value" id="infoEmail">—</span></div>
                            <div class="info-row"><span class="key">Phone</span><span class="value" id="infoPhone">—</span></div>
                            <div class="info-row"><span class="key">Role</span><span class="value" id="infoRole">—</span></div>
                            <div class="info-row"><span class="key">Year of study</span><span class="value" id="infoYearDisplay">—</span></div>
                            <div class="info-row"><span class="key">University</span><span class="value" id="infoUniversityDisplay">—</span></div>
                            <div class="info-row"><span class="key">Member since</span><span class="value" id="infoJoined">—</span></div>
                        </div>

                        <!-- EDIT MODE -->
                        <div id="editMode" class="edit-form">
                            <form id="profileForm" onsubmit="return saveProfile(event)">
                                <div class="form-group">
                                    <label for="editName">Full name</label>
                                    <input type="text" id="editName" />
                                </div>
                                <div class="form-group">
                                    <label for="editEmail">Email address</label>
                                    <input type="email" id="editEmail" disabled />
                                    <small style="color: rgba(11,26,46,0.4); font-size: 11px;">Email cannot be changed</small>
                                </div>
                                <div class="form-group">
                                    <label for="editPhone">Phone number</label>
                                    <input type="tel" id="editPhone" placeholder="+256 701 234 567" />
                                </div>
                                <div class="form-group">
                                    <label for="editRole">Role</label>
                                    <select id="editRole">
                                        <option value="student">Student</option>
                                        <option value="doctor">Doctor</option>
                                        <option value="admin">Admin</option>
                                        <option value="superadmin">Super Admin</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="editYear">Year of study</label>
                                    <input type="text" id="editYear" placeholder="e.g., Year 5" />
                                </div>
                                <div class="form-group">
                                    <label for="editUniversity">University / institution</label>
                                    <input type="text" id="editUniversity" placeholder="e.g., Makerere University" />
                                </div>

                                <div class="form-actions">
                                    <button type="submit" class="btn-save" id="saveBtn">💾 Save changes</button>
                                    <button type="button" class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- FOOTER NOTE -->
                <div style="margin-top: 28px; text-align: center; font-size: 12px; color: rgba(11,26,46,0.3); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px;">
                    <span>EaseMed · Clinical Clerkship System</span>
                    <span style="margin: 0 12px;">·</span>
                    <span>v2.1.0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ─── VERSION CONTROL ───
        const APP_VERSION = '2.1.0';
        const CACHE_KEY = 'easemed_app_version';
        
        const storedVersion = localStorage.getItem(CACHE_KEY);
        if (storedVersion !== APP_VERSION) {
            console.log('[Cache] New version detected, clearing cache...');
            if ('caches' in window) {
                caches.keys().then(keys => {
                    keys.forEach(key => caches.delete(key));
                });
            }
            localStorage.setItem(CACHE_KEY, APP_VERSION);
        }

        // ─── CONFIGURATION ───
        const SUPABASE_URL = 'https://uhjcybwczelmqkkapeac.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoamN5YndjemVsbXFra2FwZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTU3NjEsImV4cCI6MjA5Njc5MTc2MX0.mEkfofQUeBpjOgdyWqCkiX695pxbjY1LUpYrzhVH1Jc';

        // ─── GLOBALS ───
        let supabaseClient = null;
        let currentUser = null;
        let profileData = {};
        let isEditing = false;

        // ─── DOM REFS ───
        const viewMode = document.getElementById('viewMode');
        const editMode = document.getElementById('editMode');
        const toggleBtn = document.getElementById('toggleEditBtn');
        const loadingState = document.getElementById('loadingState');
        const profileContent = document.getElementById('profileContent');

        // ─── INIT SUPABASE ───
        function initSupabase() {
            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                console.warn('[Profile] Supabase SDK not available. Retrying...');
                setTimeout(initSupabase, 1000);
                return;
            }

            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
                console.log('[Profile] Supabase client initialized.');
                checkAuth();
            } catch (error) {
                console.error('[Profile] Init error:', error);
                loadingState.innerHTML = `
                    <div class="loading-spinner"></div>
                    <div class="loading-text" style="color:#DC2626;">Failed to initialize. Please refresh.</div>
                `;
            }
        }

        // ─── CHECK AUTH ───
        async function checkAuth() {
            if (!supabaseClient) {
                console.warn('[Profile] Supabase client not available');
                return;
            }

            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();

                if (error) {
                    console.error('[Profile] Session error:', error);
                    showNotice('error', 'Unable to verify session. Please sign in again.');
                    loadingState.style.display = 'none';
                    profileContent.style.display = 'block';
                    return;
                }

                if (!session) {
                    window.location.href = 'easemed_login.html';
                    return;
                }

                currentUser = session.user;
                await loadProfile();

            } catch (error) {
                console.error('[Profile] Auth error:', error);
                showNotice('error', 'Authentication error: ' + error.message);
                loadingState.style.display = 'none';
                profileContent.style.display = 'block';
            }
        }

        // ─── LOAD PROFILE ───
        async function loadProfile() {
            if (!supabaseClient || !currentUser) return;

            try {
                // Fetch profile from Supabase
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();

                if (profileError && profileError.code !== 'PGRST116') {
                    console.error('[Profile] Fetch error:', profileError);
                    // Use user metadata as fallback
                    const meta = currentUser.user_metadata || {};
                    profileData = {
                        name: meta.full_name || currentUser.email?.split('@')[0] || 'User',
                        email: currentUser.email || '—',
                        phone: meta.phone || '—',
                        role: meta.role || 'student',
                        year: meta.year || 'Year 1',
                        university: meta.university || '—',
                        joined: currentUser.created_at ? new Date(currentUser.created_at).toLocaleDateString() : '—'
                    };
                } else if (profile) {
                    profileData = {
                        name: profile.full_name || currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || 'User',
                        email: currentUser.email || '—',
                        phone: profile.phone || '—',
                        role: profile.role || 'student',
                        year: profile.year || 'Year 1',
                        university: profile.university || '—',
                        joined: profile.created_at ? new Date(profile.created_at).toLocaleDateString() : '—'
                    };
                }

                renderView();
                loadingState.style.display = 'none';
                profileContent.style.display = 'block';

            } catch (error) {
                console.error('[Profile] Load error:', error);
                showNotice('error', 'Failed to load profile: ' + error.message);
                loadingState.style.display = 'none';
                profileContent.style.display = 'block';
            }
        }

        // ─── RENDER VIEW ───
        function renderView() {
            document.getElementById('userFullName').textContent = profileData.name;
            document.getElementById('userAvatar').textContent = getInitials(profileData.name);
            document.getElementById('userRole').textContent = formatRole(profileData.role);
            document.getElementById('userYear').textContent = profileData.year;
            document.getElementById('userUniversity').textContent = profileData.university;

            document.getElementById('infoName').textContent = profileData.name;
            document.getElementById('infoEmail').textContent = profileData.email;
            document.getElementById('infoPhone').textContent = profileData.phone;
            document.getElementById('infoRole').textContent = formatRole(profileData.role);
            document.getElementById('infoYearDisplay').textContent = profileData.year;
            document.getElementById('infoUniversityDisplay').textContent = profileData.university;
            document.getElementById('infoJoined').textContent = profileData.joined;

            // Populate edit form
            document.getElementById('editName').value = profileData.name;
            document.getElementById('editEmail').value = profileData.email;
            document.getElementById('editPhone').value = profileData.phone;
            document.getElementById('editRole').value = profileData.role || 'student';
            document.getElementById('editYear').value = profileData.year;
            document.getElementById('editUniversity').value = profileData.university;
        }

        // ─── FORMAT ROLE FOR DISPLAY ───
        function formatRole(role) {
            if (!role) return 'Student';
            const roleMap = {
                'student': 'Student',
                'doctor': 'Doctor',
                'admin': 'Admin',
                'superadmin': 'Super Admin'
            };
            return roleMap[role] || role.charAt(0).toUpperCase() + role.slice(1);
        }

        // ─── UTILITY ───
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.slice(0, 2).toUpperCase();
        }

        function showNotice(type, message) {
            const container = document.getElementById('profileNotice');
            container.innerHTML = '';
            const wrap = document.createElement('div');
            wrap.className = `notice ${type === 'success' ? 'notice-success' : 'notice-error'}`;
            const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            icon.setAttribute('width', '16');
            icon.setAttribute('height', '16');
            icon.setAttribute('viewBox', '0 0 24 24');
            icon.setAttribute('fill', 'none');
            icon.setAttribute('stroke', 'currentColor');
            icon.setAttribute('stroke-width', '2');
            icon.setAttribute('stroke-linecap', 'round');
            icon.setAttribute('stroke-linejoin', 'round');
            icon.innerHTML = type === 'success' ?
                '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' :
                '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
            const text = document.createElement('span');
            text.textContent = message;
            wrap.appendChild(icon);
            wrap.appendChild(text);
            container.appendChild(wrap);

            setTimeout(() => {
                if (container.firstChild) container.innerHTML = '';
            }, 5000);
        }

        // ─── TOGGLE EDIT ───
        function toggleEdit() {
            isEditing = !isEditing;
            if (isEditing) {
                viewMode.style.display = 'none';
                editMode.classList.add('active');
                toggleBtn.textContent = '✕ Cancel';
                document.getElementById('editName').value = profileData.name;
                document.getElementById('editEmail').value = profileData.email;
                document.getElementById('editPhone').value = profileData.phone;
                document.getElementById('editRole').value = profileData.role || 'student';
                document.getElementById('editYear').value = profileData.year;
                document.getElementById('editUniversity').value = profileData.university;
                document.getElementById('profileNotice').innerHTML = '';
            } else {
                cancelEdit();
            }
        }

        function cancelEdit() {
            isEditing = false;
            viewMode.style.display = 'block';
            editMode.classList.remove('active');
            toggleBtn.textContent = '✎ Edit';
            document.getElementById('profileNotice').innerHTML = '';
        }

        // ─── SAVE PROFILE TO SUPABASE ───
        async function saveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Saving…';

            const newData = {
                full_name: document.getElementById('editName').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                role: document.getElementById('editRole').value,
                year: document.getElementById('editYear').value.trim(),
                university: document.getElementById('editUniversity').value.trim(),
            };

            // Validation
            if (!newData.full_name) {
                showNotice('error', 'Full name is required.');
                btn.disabled = false;
                btn.innerHTML = '💾 Save changes';
                return;
            }

            try {
                // Build update object
                const updateData = {
                    full_name: newData.full_name,
                    phone: newData.phone,
                    role: newData.role,
                    year: newData.year,
                    university: newData.university,
                    updated_at: new Date().toISOString()
                };

                console.log('[Profile] Updating with data:', updateData);

                // Update profile in Supabase
                const { error: updateError } = await supabaseClient
                    .from('profiles')
                    .update(updateData)
                    .eq('id', currentUser.id);

                if (updateError) throw updateError;

                // Update user metadata (for auth)
                await supabaseClient.auth.updateUser({
                    data: {
                        full_name: newData.full_name,
                        role: newData.role,
                        year: newData.year,
                        university: newData.university,
                        phone: newData.phone
                    }
                });

                // Update local data
                profileData = {
                    name: newData.full_name,
                    email: currentUser.email || '—',
                    phone: newData.phone,
                    role: newData.role,
                    year: newData.year,
                    university: newData.university,
                    joined: profileData.joined
                };

                renderView();
                showNotice('success', '✅ Profile updated successfully in Supabase!');
                cancelEdit();

            } catch (error) {
                console.error('[Profile] Save error:', error);
                showNotice('error', 'Failed to save: ' + error.message);
            }

            btn.disabled = false;
            btn.innerHTML = '💾 Save changes';
        }

        // ─── SIGN OUT ───
        async function handleLogout() {
            if (confirm('Sign out from EaseMed?')) {
                try {
                    if (supabaseClient) {
                        await supabaseClient.auth.signOut();
                    }
                    localStorage.removeItem('easemed_user');
                    window.location.href = 'easemed_login.html';
                } catch (error) {
                    console.error('[SignOut] Error:', error);
                    window.location.href = 'easemed_login.html';
                }
            }
        }

        // ─── DOM CONTENT LOADED ───
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[Profile] DOM ready, initializing...');
            
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                initSupabase();
            } else {
                loadingState.innerHTML = `
                    <div class="loading-spinner"></div>
                    <div class="loading-text" style="color:#DC2626;">Supabase SDK failed to load. Please refresh.</div>
                `;
                // Retry after a moment
                setTimeout(() => {
                    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                        initSupabase();
                    }
                }, 3000);
            }
        });
    </script>
</body>
