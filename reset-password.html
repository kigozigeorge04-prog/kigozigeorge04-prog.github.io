<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - EaseMed</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="loadFallbackCDN()"></script>
<script>
  // Fallback CDN injection in case the primary CDN fails to load
  // (mirrors the pattern used on modules.html / easemed_login.html)
  function loadFallbackCDN() {
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';
    s.onload = function () { initSupabase(); };
    s.onerror = function () {
      showMessage('Could not load required libraries. Please check your internet connection and reload the page.', 'error');
    };
    document.head.appendChild(s);
  }
</script>
<style>
  :root {
    --midnight-900: #060b18;
    --midnight-800: #0a1128;
    --midnight-700: #101a3a;
    --accent-blue: #3b82f6;
    --accent-blue-light: #60a5fa;
    --glass-border: rgba(255, 255, 255, 0.12);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --error-red: #f87171;
    --success-green: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, #0f1c3f 0%, var(--midnight-900) 55%, #020509 100%);
    color: var(--text-primary);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(16, 26, 58, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo-row svg { width: 32px; height: 32px; }

  h1 {
    font-size: 20px;
    text-align: center;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input[type="password"]:focus {
    border-color: var(--accent-blue);
    background: rgba(255, 255, 255, 0.06);
  }

  .strength-hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-blue), #2563eb);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }

  button:hover:not(:disabled) { opacity: 0.92; }
  button:active:not(:disabled) { transform: scale(0.99); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .message {
    display: none;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .message.error {
    display: block;
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: var(--error-red);
  }

  .message.success {
    display: block;
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.3);
    color: var(--success-green);
  }

  .message.info {
    display: block;
    background: rgba(96, 165, 250, 0.1);
    border: 1px solid rgba(96, 165, 250, 0.3);
    color: var(--accent-blue-light);
  }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 13.5px;
    color: var(--text-secondary);
    text-decoration: none;
  }

  .back-link:hover { color: var(--accent-blue-light); }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21s-7.5-4.6-10-9.3C.4 7.9 2.4 4 6.2 4c2 0 3.6 1.1 4.5 2.6.2.3.6.3.8 0C12.4 5.1 14 4 16 4c3.8 0 5.8 3.9 4.2 7.7C19.5 16.4 12 21 12 21z" stroke="#60a5fa" stroke-width="1.5"/>
      <path d="M3 12h4l1.5-3 3 6 1.5-3H21" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Set a new password</h1>
  <p class="subtitle" id="subtitle">Enter and confirm your new password below.</p>

  <div id="message" class="message"></div>

  <form id="resetForm">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="Enter new password" autocomplete="new-password" required minlength="8">
      <div class="strength-hint">At least 8 characters.</div>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" id="submitBtn">Update password</button>
  </form>

  <a href="/easemed_login.html" class="back-link" id="backLink">← Back to login</a>
</div>

<script>
  // ==== CONFIG: match these to your existing easemed_login.html values ====
  const SUPABASE_URL = 'https://uhjcybwczelmqkkapeac.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoamN5YndjemVsbXFra2FwZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTU3NjEsImV4cCI6MjA5Njc5MTc2MX0.mEkfofQUeBpjOgdyWqCkiX695pxbjY1LUpYrzhVH1Jc'; // the eyJ... anon key
  // ==========================================================================

  let sb = null;
  let sessionReady = false;

  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
  }

  function clearMessage() {
    const el = document.getElementById('message');
    el.className = 'message';
    el.textContent = '';
  }

  function setLoading(isLoading, label) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = isLoading;
    btn.innerHTML = isLoading ? '<span class="spinner"></span>' + label : label;
  }

  async function initSupabase() {
    try {
      if (!window.supabase) {
        showMessage('Library failed to load. Please refresh the page.', 'error');
        return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      window.sb = sb; // expose globally to match rest of app's pattern

      // Supabase recovery links can arrive as:
      //  - PKCE flow: ?code=XXXX  -> needs exchangeCodeForSession
      //  - Implicit flow: #access_token=...&type=recovery in the URL hash
      const url = new URL(window.location.href);
      const code = url.searchParams.get('code');
      const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
      const hasHashToken = hashParams.get('access_token') && hashParams.get('type') === 'recovery';

      if (code) {
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) {
          showMessage('This reset link is invalid or has expired. Please request a new one.', 'error');
          document.getElementById('resetForm').style.display = 'none';
          return;
        }
        sessionReady = true;
      } else if (hasHashToken) {
        // supabase-js v2 automatically picks up the hash session on load,
        // but we confirm it explicitly here.
        const { data, error } = await sb.auth.getSession();
        if (error || !data.session) {
          showMessage('This reset link is invalid or has expired. Please request a new one.', 'error');
          document.getElementById('resetForm').style.display = 'none';
          return;
        }
        sessionReady = true;
      } else {
        // No token in URL at all — page opened directly, not from an email link
        const { data } = await sb.auth.getSession();
        if (data.session) {
          sessionReady = true;
        } else {
          showMessage('No reset token found. Please use the link from your password reset email.', 'error');
          document.getElementById('resetForm').style.display = 'none';
        }
      }
    } catch (err) {
      console.error('Supabase init error:', err);
      showMessage('Something went wrong loading this page. Please refresh and try again.', 'error');
    }
  }

  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMessage();

    if (!sessionReady || !sb) {
      showMessage('Session not ready yet. Please wait a moment and try again.', 'error');
      return;
    }

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 8) {
      showMessage('Password must be at least 8 characters.', 'error');
      return;
    }
    if (password !== confirmPassword) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    setLoading(true, 'Updating...');

    try {
      const { error } = await sb.auth.updateUser({ password: password });
      if (error) {
        showMessage(error.message || 'Failed to update password. Please try again.', 'error');
        setLoading(false, 'Update password');
        return;
      }

      showMessage('Password updated successfully! Redirecting to login...', 'success');
      document.getElementById('resetForm').style.display = 'none';

      // Sign out the recovery session so they log in fresh with the new password
      await sb.auth.signOut();

      setTimeout(function () {
        window.location.href = '/easemed_login.html';
      }, 2000);
    } catch (err) {
      console.error('Password update error:', err);
      showMessage('Something went wrong. Please try again.', 'error');
      setLoading(false, 'Update password');
    }
  });

  // Kick things off once the primary or fallback script has loaded
  window.addEventListener('DOMContentLoaded', function () {
    if (window.supabase) {
      initSupabase();
    } else {
      // give the CDN a moment; onerror handler above covers the failure case
      setTimeout(function () {
        if (window.supabase) initSupabase();
      }, 800);
    }
  });
</script>

</body>
</html>
