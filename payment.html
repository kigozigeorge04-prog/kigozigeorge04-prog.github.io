<script>
  // ── Config ──────────────────────────────────────────────
  const SUPABASE_URL = "https://uhjcybwczelmqkkapeac.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoamN5YndjemVsbXFra2FwZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTU3NjEsImV4cCI6MjA5Njc5MTc2MX0.mEkfofQUeBpjOgdyWqCkiX695pxbjY1LUpYrzhVH1Jc";
  const INITIATE_PAYMENT_URL = "https://uhjcybwczelmqkkapeac.supabase.co/functions/v1/initiate-payment";

  // ✅ Use a different name to avoid clashes
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── On page load: check auth + subscription ──────────────
  async function init() {
    const { data: { user } } = await sb.auth.getUser();

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const { data: sub } = await sb
      .from("subscriptions")
      .select("status, expires_at")
      .eq("user_id", user.id)
      .eq("status", "active")
      .gt("expires_at", new Date().toISOString())
      .single();

    if (sub) {
      const expiry = new Date(sub.expires_at).toLocaleDateString("en-UG", {
        day: "numeric", month: "long", year: "numeric"
      });
      document.getElementById("alreadySubscribed").style.display = "block";
      document.getElementById("paymentForm").style.display = "none";
      document.getElementById("expiresText").textContent = `Your subscription is active until ${expiry}`;
    }
  }

  // ── Initiate payment (now globally accessible) ──────────
  async function initiatePayment() {
    const phone = document.getElementById("phone").value.trim();
    const btn = document.getElementById("payBtn");
    const statusEl = document.getElementById("status");

    if (!phone || phone.length < 12 || !phone.startsWith("256")) {
      showStatus("Please enter a valid MTN number starting with 256", "error");
      return;
    }

    const { data: { user } } = await sb.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }

    const { data: plan } = await sb
      .from("plans")
      .select("id")
      .eq("name", "EaseMed Student Monthly")
      .single();

    if (!plan) {
      showStatus("Could not load plan. Please refresh and try again.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending request...";
    showStatus("Sending payment request to your phone...", "info");

    try {
      const { data: { session } } = await sb.auth.getSession();

      const res = await fetch(INITIATE_PAYMENT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`
        },
        body: JSON.stringify({
          user_id: user.id,
          plan_id: plan.id,
          phone_number: phone
        })
      });

      const result = await res.json();

      if (result.success) {
        showStatus(
          "✓ Request sent! Check your phone for an MTN MoMo prompt and enter your PIN to complete payment. This page will update automatically.",
          "success"
        );
        btn.textContent = "Waiting for payment...";
        pollPaymentStatus(result.payment_id);
      } else {
        throw new Error(result.error || "Payment request failed");
      }

    } catch (err) {
      showStatus(`Error: ${err.message}`, "error");
      btn.disabled = false;
      btn.textContent = "Pay UGX 5,000 via MTN MoMo";
    }
  }

  // ── Poll Supabase until payment is confirmed ─────────────
  async function pollPaymentStatus(paymentId) {
    const interval = setInterval(async () => {
      const { data: payment } = await sb
        .from("payments")
        .select("status")
        .eq("id", paymentId)
        .single();

      if (payment?.status === "successful") {
        clearInterval(interval);
        showStatus("🎉 Payment successful! Your subscription is now active.", "success");
        setTimeout(() => window.location.href = "index.html", 2000);
      } else if (payment?.status === "failed") {
        clearInterval(interval);
        showStatus("Payment failed or was cancelled. Please try again.", "error");
        const btn = document.getElementById("payBtn");
        btn.disabled = false;
        btn.textContent = "Pay UGX 5,000 via MTN MoMo";
      }
    }, 5000);

    setTimeout(() => clearInterval(interval), 180000);
  }

  // ── Helper ───────────────────────────────────────────────
  function showStatus(message, type) {
    const el = document.getElementById("status");
    el.textContent = message;
    el.className = `status ${type}`;
  }

  // ── Init ─────────────────────────────────────────────────
  init();
</script>
